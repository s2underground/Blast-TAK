# Blast Desktop test installers for Windows, macOS and Linux (unsigned).
# Run by hand from the Actions tab; the installers are the run's artifacts
# (kept 30 days). Test builds only: Blast Desktop is not released, and the
# desktop app is moving to its own project.
name: Blast Desktop

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Test build label (shown in the app and file names)'
        required: true
        default: 'test1'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            types: msi app-image
          - os: macos-15          # Apple silicon
            types: dmg
          - os: macos-15-intel    # Intel
            types: dmg
          - os: ubuntu-22.04
            types: deb app-image
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: WiX Toolset 3 (for the Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "WiX Toolset v3*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) {
              choco install wixtoolset -y --no-progress
              $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "WiX Toolset v3*" -Directory | Select-Object -First 1
            }
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Test
        working-directory: desktop
        run: gradle test

      - name: Package
        working-directory: desktop
        shell: bash
        run: |
          for t in ${{ matrix.types }}; do
            gradle jpackage -PinstallerType=$t -PbuildLabel="${{ inputs.label }}"
          done
          ls -l build/dist

      - uses: actions/upload-artifact@v4
        with:
          name: blast-desktop-${{ inputs.label }}-${{ matrix.os }}
          path: desktop/build/dist/*
          if-no-files-found: error
          retention-days: 30
