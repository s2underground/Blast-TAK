# Blast Desktop installers for Windows, macOS and Linux (unsigned).
# Runs when a desktop-v* tag is pushed (then drafts a GitHub release with
# the installers for review) or by hand from the Actions tab (installers
# are kept as the run's artifacts).
name: Blast Desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            types: msi app-image
          - os: macos-15          # Apple silicon
            types: dmg
          - os: macos-15-intel    # Intel
            types: dmg
          - os: ubuntu-22.04
            types: deb app-image
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: WiX Toolset 3 (for the Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "WiX Toolset v3*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) {
              choco install wixtoolset -y --no-progress
              $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "WiX Toolset v3*" -Directory | Select-Object -First 1
            }
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Test
        working-directory: desktop
        run: gradle test

      - name: Package
        working-directory: desktop
        shell: bash
        run: |
          for t in ${{ matrix.types }}; do
            gradle jpackage -PinstallerType=$t
          done
          ls -l build/dist

      - uses: actions/upload-artifact@v4
        with:
          name: blast-desktop-${{ matrix.os }}
          path: desktop/build/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --latest=false \
            --title "Blast Desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Draft: installers built from $GITHUB_SHA. Add the release notes before publishing."
