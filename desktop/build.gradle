// Blast desktop test host: Blast's core (from the ATAK plugin's sources,
// unchanged) with a Swing pane and a plain map. Plain Java, no ATAK.
//   gradle run      start it
//   gradle jar      build/libs/blast-desktop.jar (java -jar to run)
plugins {
    id 'application'
}

// Java 17 bytecode (TAK-X's runtime); builds with any JDK 17 or later.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Reads offline MBTiles maps (SQLite). Apache License 2.0.
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
    main {
        java {
            srcDirs = ['src/main/java', '../app/src/main/java']
            include 'com/atakmap/android/blast/plugin/core/**'
            include 'com/atakmap/android/blast/plugin/desktop/**'
            include 'com/atakmap/android/blast/plugin/swing/**'
        }
    }
}

application {
    mainClass = 'com.atakmap.android.blast.plugin.desktop.BlastDesktop'
}

jar {
    archiveFileName = 'blast-desktop.jar'
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}
