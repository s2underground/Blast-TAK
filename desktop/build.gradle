// Blast Desktop: Blast's core (from the ATAK plugin's sources, unchanged)
// with a Swing pane, a tile map and ATAK mesh sharing. Plain Java, no ATAK.
//   gradle run        start it
//   gradle test       the desktop's own tests
//   gradle jpackage   an installer for this OS in build/dist
//                     (-PinstallerType=msi|exe|dmg|pkg|deb|rpm|app-image;
//                     needs a JDK 21 jpackage; app-image is zipped)
plugins {
    id 'application'
}

def appVersion = '1.2'

// Java 17 bytecode; builds with any JDK 17 or later.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Reads offline MBTiles maps (SQLite). Apache License 2.0.
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
    main {
        java {
            srcDirs = ['src/main/java', '../app/src/main/java']
            include 'com/atakmap/android/blast/plugin/core/**'
            include 'com/atakmap/android/blast/plugin/desktop/**'
            include 'com/atakmap/android/blast/plugin/swing/**'
        }
    }
}

application {
    mainClass = 'com.atakmap.android.blast.plugin.desktop.BlastDesktop'
}

jar {
    archiveFileName = 'blast-desktop.jar'
    manifest {
        attributes 'Main-Class': application.mainClass,
                'Implementation-Version': appVersion
    }
}

// ---------------------------------------------------------------------
// Installers (jpackage): a trimmed Java runtime is bundled, so users
// don't install Java. Unsigned.

def os = org.gradle.internal.os.OperatingSystem.current()
def arch = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'arm64'
        : 'x64'
def osName = os.windows ? 'windows' : os.macOsX ? 'macos' : 'linux'
def installerType = project.findProperty('installerType') ?:
        (os.windows ? 'msi' : os.macOsX ? 'dmg' : 'deb')
def jpackageIn = layout.buildDirectory.dir('jpackage/input')
def jpackageOut = layout.buildDirectory.dir("jpackage/${installerType}")
def dist = layout.buildDirectory.dir('dist')

tasks.register('jpackageInput', Sync) {
    dependsOn jar
    from jar.archiveFile
    from configurations.runtimeClasspath
    into jpackageIn
}

tasks.register('jpackageImage', Exec) {
    dependsOn 'jpackageInput'
    def out = jpackageOut.get().asFile
    doFirst {
        delete out
    }
    def home = System.getenv('JAVA_HOME')
    executable = home ? "${home}/bin/jpackage" : 'jpackage'
    def a = [
        '--type', installerType,
        '--name', 'Blast',
        '--app-version', appVersion,
        '--vendor', 'S2 Underground',
        '--copyright', 'S2 Underground',
        '--description', 'Blast: bomb threat, ordnance and nuclear standoff reference',
        '--input', jpackageIn.get().asFile.path,
        '--main-jar', 'blast-desktop.jar',
        '--main-class', application.mainClass.get(),
        '--dest', out.path,
        '--app-content', file('packaging/content/THIRD-PARTY-NOTICES.txt').path,
        '--add-modules', 'java.base,java.desktop,java.net.http,java.sql,java.logging,java.xml,jdk.crypto.ec,jdk.accessibility',
        '--jlink-options', '--strip-debug --no-man-pages --no-header-files',
        '--java-options', '-Xmx1g',
    ]
    boolean pkg = installerType != 'app-image'
    if (os.windows) {
        a += ['--icon', file('packaging/blast.ico').path]
        if (pkg)
            a += ['--win-menu', '--win-menu-group', 'S2 Underground',
                  '--win-shortcut', '--win-dir-chooser',
                  '--win-per-user-install',
                  '--win-upgrade-uuid', '6a7c3f1e-2b0d-4c5e-9f1a-b1a57de5c0a1']
    } else if (os.macOsX) {
        a += ['--icon', file('packaging/blast.icns').path,
              '--mac-package-identifier', 'com.s2underground.blast.desktop',
              '--mac-package-name', 'Blast']
    } else {
        a += ['--icon', file('packaging/blast-256.png').path]
        if (pkg)
            a += ['--linux-package-name', 'blast-desktop',
                  '--linux-menu-group', 'Utility',
                  '--linux-shortcut',
                  '--linux-app-category', 'utils']
    }
    args a
}

tasks.register('jpackage') {
    dependsOn 'jpackageImage'
    def base = "Blast-Desktop-${appVersion}-${osName}-${arch}"
    doLast {
        def out = jpackageOut.get().asFile
        def d = dist.get().asFile
        d.mkdirs()
        if (installerType == 'app-image') {
            // A portable folder, zipped (tar.gz on Linux and macOS keeps
            // the launchers executable).
            if (os.windows) {
                ant.zip(destfile: new File(d, "${base}-portable.zip")) {
                    zipfileset(dir: out, prefix: '')
                }
            } else {
                exec {
                    commandLine 'tar', '-czf',
                            new File(d, "${base}-portable.tar.gz").path,
                            '-C', out.path, '.'
                }
            }
        } else {
            out.listFiles().each { f ->
                def ext = f.name.substring(f.name.lastIndexOf('.'))
                copy {
                    from f
                    into d
                    rename { "${base}${ext}" }
                }
            }
        }
        println "Installer in ${d}"
    }
}
